#
# Builds the signed Android release APKs on version tags.
#
# Release-only by design: there is no debug job. The job fails loudly when the
# signing secrets are absent, so a green run always means shippable APKs.
# Required secrets: ANDROID_KEYSTORE_BASE64 (base64 of the release keystore),
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
#
# Canonical local procedure: rust-client/build_so.bat [--tests] for the native
# .so files plus scripts/build_apk.sh for the APKs. CI mirrors them step for
# step: cargo-ndk per-ABI release builds, native_client_provenance.ps1
# Write+Verify, assembleRelease, verify_apk_deploy_asset.ps1 on the universal
# APK. One deliberate gap: `cargo test` in rust-client stays local
# (build_so.bat --tests) because the client integration suite needs live
# network fixtures; CI runs fmt, clippy and the no-runtime-panics gate.
#
# Pinned toolchain. Rust MUST match rust-client/Cargo.toml `rust-version`.
# cargo-ndk, NDK, cmake and build-tools are pinned here because no local pin
# exists to mirror (build_so.bat only asserts their presence).
# JDK 17 is the AGP 9.x minimum; Gradle comes from the repo wrapper (9.4.1).

name: android-release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to rebuild (e.g. v2.1.9). Retry backstop: reruns a failed tag build without pushing a new tag."
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  CARGO_NDK_VERSION: "4.1.2"
  NDK_VERSION: "26.3.11579264"
  CMAKE_VERSION: "3.22.1"
  BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_PLATFORM: "android-36"

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build signed release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve release tag
        id: release-tag
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          if [[ -z "$TAG" ]]; then
            echo "::error::No tag resolved. Manual runs must pass the 'tag' input (e.g. v2.1.9)."
            exit 1
          fi
          if [[ "$TAG" != v* ]]; then
            echo "::error::Tag must match 'v*' (got '$TAG')."
            exit 1
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG"

      - name: Check out ${{ steps.release-tag.outputs.value }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-tag.outputs.value }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install platform, NDK and CMake
        run: |
          set -euo pipefail
          sdkmanager "platforms;${{ env.ANDROID_PLATFORM }}" "build-tools;${{ env.BUILD_TOOLS_VERSION }}" "ndk;${{ env.NDK_VERSION }}" "cmake;${{ env.CMAKE_VERSION }}" "platform-tools"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} + Android targets
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
          components: rustfmt, clippy

      - name: Install cargo-ndk ${{ env.CARGO_NDK_VERSION }}
        run: cargo install cargo-ndk --version "${{ env.CARGO_NDK_VERSION }}" --locked

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Release-only gate: fail here with a readable message instead of
      # halfway through assembleRelease inside verifyReleaseSigning.
      - name: Require signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing secret: $name. This workflow is release-only; add the four signing secrets."
              missing=1
            fi
          done
          if [[ "$missing" == 1 ]]; then
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/release.keystore"
          test -s "$GITHUB_WORKSPACE/release.keystore"
          ls -l "$GITHUB_WORKSPACE/release.keystore"

      # Mirrors build_so.bat --tests gates minus `cargo test` (see header).
      - name: Rust client gates (fmt, no-panics, clippy)
        working-directory: rust-client
        run: |
          set -euo pipefail
          cargo +"${{ env.RUST_TOOLCHAIN }}" fmt --all -- --check
          pwsh -NoProfile -File check_no_runtime_panics.ps1
          cargo +"${{ env.RUST_TOOLCHAIN }}" clippy --all-targets -- -D warnings

      # Mirrors build_so.bat parallel ABI builds (sequential here: one runner,
      # isolated target dirs already keep artefacts apart) plus the
      # jniLibs copy and native_client_provenance.ps1 Write+Verify.
      - name: Build native libclient.so per ABI
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "4"
        run: |
          set -euo pipefail
          cd rust-client
          cargo +"${{ env.RUST_TOOLCHAIN }}" ndk -t arm64-v8a -P 26 build --release --target-dir "$GITHUB_WORKSPACE/build/rust-client-android-arm64"
          cargo +"${{ env.RUST_TOOLCHAIN }}" ndk -t armeabi-v7a -P 26 build --release --target-dir "$GITHUB_WORKSPACE/build/rust-client-android-armeabi-v7a"
          cargo +"${{ env.RUST_TOOLCHAIN }}" ndk -t x86_64 -P 26 build --release --target-dir "$GITHUB_WORKSPACE/build/rust-client-android-x86_64"
          mkdir -p ../app/src/main/jniLibs/arm64-v8a ../app/src/main/jniLibs/armeabi-v7a ../app/src/main/jniLibs/x86_64
          cp "$GITHUB_WORKSPACE/build/rust-client-android-arm64/aarch64-linux-android/release/client" ../app/src/main/jniLibs/arm64-v8a/libclient.so
          cp "$GITHUB_WORKSPACE/build/rust-client-android-armeabi-v7a/armv7-linux-androideabi/release/client" ../app/src/main/jniLibs/armeabi-v7a/libclient.so
          cp "$GITHUB_WORKSPACE/build/rust-client-android-x86_64/x86_64-linux-android/release/client" ../app/src/main/jniLibs/x86_64/libclient.so
          ls -lh ../app/src/main/jniLibs/*/*.so
          pwsh -NoProfile -File ../scripts/native_client_provenance.ps1 -Mode Write
          pwsh -NoProfile -File ../scripts/native_client_provenance.ps1 -Mode Verify

      - name: Assemble signed release APKs
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ls -lh app/build/outputs/apk/release/

      - name: Verify deploy asset in universal APK
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/verify_apk_deploy_asset.ps1 -ApkPath app/build/outputs/apk/release/app-universal-release.apk

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: csqtt-apks-${{ steps.release-tag.outputs.value }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
